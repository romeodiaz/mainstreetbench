<h1>Checkout</h1>
<table id="cart-lines" class="lines"></table>
<form id="checkout">
  <label>Name <input name="name" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Phone <input name="phone" type="tel"></label>
  <label>Pickup date <input name="pickup_date" type="date" required></label>
  <label>Pickup time <select name="pickup_time" required><option value="">Choose a date first</option></select></label>
  <p>Open Tuesday–Sunday, 7am–3pm. Allow 2 hours; birthday cakes and catering trays need 48 hours.</p>
  <p id="availability" role="status"></p>
  <label>Gift card code <input name="gift_card_code" autocomplete="off"></label>
  <label>Promo code <input name="promo_code"></label>
  <p id="checkout-error" class="error" role="alert"></p>
  <button type="submit">Place order</button>
</form>
<script src="/static/checkout.js"></script>
