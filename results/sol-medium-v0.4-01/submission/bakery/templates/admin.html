<h1>Orders</h1>
<form method="get" action="/admin"><label>Pickup date <input type="date" name="date" value="$date"></label> <button>Show</button> <a href="/admin">All</a></form>
<table class="admin">
<thead><tr><th>Order</th><th>Pickup</th><th>Customer</th><th>Items</th><th>Due at pickup</th><th>Status</th></tr></thead>
<tbody>
$rows
</tbody>
</table>

<h2>Register an existing gift card</h2>
<p>For cards bought before this update: verify payment and the current balance in your records first. Register each card once.</p>
<form id="import-card">
<label>Original order number <input name="order_id" type="number" min="1" step="1" required></label>
<label>Existing card code <input name="code" pattern="[A-Za-z0-9-]{3,64}" required></label>
<label>Verified remaining balance (dollars) <input name="balance" type="number" min="0" step="0.01" required></label>
<button>Register verified card</button>
</form>
<p id="admin-error" class="error" role="alert"></p>
<script src="/static/admin.js"></script>
