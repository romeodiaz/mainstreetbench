<h1>Checkout</h1>
<table id="cart-lines" class="lines"></table>
<form id="checkout">
  <label>Name <input name="name" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Phone <input name="phone" type="tel"></label>
  <label>Pickup date <input name="pickup_date" type="date" required></label>
  <label>Pickup time <select name="pickup_slot" required disabled><option value="">Choose a date first</option></select></label>
  <p>Allow 2 hours for pickup, or 48 hours for birthday cakes and catering trays.</p>
  <label>Promo code <input name="promo_code"></label>
  <p id="checkout-error" class="error" role="alert"></p>
  <button type="submit">Place order</button>
</form>
<script src="/static/checkout.js"></script>
